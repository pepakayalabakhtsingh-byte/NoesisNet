data_dir: "data"
output_dir: "output"
log_dir: "logs"
log_level: "INFO"
supported_extensions:
  pdf: [".pdf"]
  audio: [".mp3", ".wav", ".m4a"]
  schematic: [".png", ".jpg", ".jpeg", ".tiff", ".bmp"]
  table: [".csv", ".xlsx", ".xls"]

whisper:
  model_size: "base"          # Options: tiny, base, small, medium, large
  language: null              # null = auto-detect, or set e.g. "en"
  task: "transcribe"          # "transcribe" or "translate"
  word_timestamps: true       # if true, returns word-level timestamps in segments
